name: Bug
description: Something behaves differently from what the documentation says
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        A security problem is not this: it goes through the private channel in
        SECURITY.md, never into a public issue.

  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true

  - type: checkboxes
    id: platforms
    attributes:
      label: Where you saw it
      description: >
        Native toolkits differ, so name every host on which the behavior was
        exercised.
      options:
        - label: Android Views / Android
        - label: WinUI 3 / Windows
        - label: GTK 4 / Linux
        - label: Web / WebAssembly

  - type: textarea
    id: repro
    attributes:
      label: The smallest thing that reproduces it
      description: >
        A few lines of Swift, or a failing test. Worth more than a description.
      render: swift
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: The SwiftOmniUI version and Swift toolchain if the build is what failed.
      placeholder: SwiftOmniUI 0.5.2, Swift 6.4
    validations:
      required: true
